<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="360" viewBox="0 0 1100 360" role="img" aria-labelledby="title desc">
<title id="title">InstaKart Render and Supabase architecture</title>
<desc id="desc">The browser connects to a Render web service for Next.js and the commerce API. Supabase provides Auth and Postgres. An optional model provider augments the built-in planner.</desc>
<rect width="1100" height="360" rx="24" fill="#f8fafc"/>
<g font-family="Arial,sans-serif" fill="#0f172a">
<text x="40" y="48" font-size="25" font-weight="bold">InstaKart · Render + Supabase</text>
<g stroke="#cbd5e1" stroke-width="2" fill="white"><rect x="40" y="105" width="220" height="150" rx="16"/><rect x="350" y="105" width="320" height="150" rx="16"/><rect x="760" y="85" width="300" height="100" rx="16"/><rect x="760" y="210" width="300" height="100" rx="16"/></g>
<g font-size="20" font-weight="bold" text-anchor="middle"><text x="150" y="155">Browser</text><text x="510" y="145">Render Free</text><text x="910" y="125">Supabase Free</text><text x="910" y="250">Optional model API</text></g>
<g font-size="15" text-anchor="middle"><text x="150" y="185">Storefront + Admin</text><text x="150" y="210">Email/password login</text><text x="510" y="177">Next.js + Node commerce API</text><text x="510" y="205">Built-in inventory planner</text><text x="910" y="155">Auth + Postgres transactions</text><text x="910" y="280">Generative planning + tips</text></g>
